name: iTunes ID check (post-merge)

# Post-merge changed-file sanity check. Path-filtered at the workflow trigger
# so it only runs when a push to main actually touches a puzzle file — that's
# GitHub Actions' native file-glob conditional. The pre-merge equivalent lives
# in puzzle-checks.yml and is gated by the required-reviewer environment.
#
# Manual dispatch runs the deliberate full-fleet catalog drift sweep instead.

on:
  push:
    branches: [main]
    paths:
      - 'src/puzzles/*.ts'
      - '!src/puzzles/template.ts'
  workflow_dispatch:

permissions:
  contents: read

# Serialize per-ref rather than cancelling: every merge commit to main deserves
# its own check, so a fast follow-up push queues behind the first run instead of
# superseding it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  itunes:
    name: iTunes ID check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Scope iTunes check to pushed puzzle files
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo 'ITUNES_CHANGED_FILES<<EOF'
            git diff --name-only --diff-filter=ACMR "$BEFORE" "$SHA" -- 'src/puzzles/*.ts' ':(exclude)src/puzzles/template.ts'
            echo EOF
          } >> "$GITHUB_ENV"
      - name: Changed puzzle iTunes check
        if: github.event_name == 'push'
        run: npm run test:itunes
      - name: Full-fleet iTunes sweep
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:itunes:all
