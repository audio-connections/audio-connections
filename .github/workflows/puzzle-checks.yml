name: Puzzle PR checks

# Pre-merge validation for puzzle changes, path-filtered to fire only when a
# PR (or manual dispatch) touches a puzzle file. Gated by the `puzzle-checks`
# GitHub environment — the job pauses at the gate until a required reviewer
# clicks Approve in the Actions UI, so a PR can't fire any step (network
# call, npm install, etc.) on its own.
#
# One-time setup so the gate works:
#   1. Repo Settings → Environments → New environment "puzzle-checks".
#   2. Under "Required reviewers", add the maintainer(s) allowed to
#      green-light a puzzle PR's checks.
#   Until that environment exists with reviewers, GitHub may either skip
#   the job with an error or run it unguarded depending on org defaults —
#   configure it before relying on the gate.
#
# Post-merge validation lives in itunes-postmerge.yml, which re-runs
# changed-file `npm run test:itunes` on pushes to main that touch a puzzle file.

on:
  pull_request:
    paths:
      - 'src/puzzles/*.ts'
      - '!src/puzzles/template.ts'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the PR supersedes the old answer, so cancel the in-flight run.
# This also releases a run still waiting at the required-reviewer gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-checks:
    name: Puzzle PR checks
    runs-on: ubuntu-latest
    environment: puzzle-checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Scope iTunes check to changed puzzle files
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
          {
            echo 'ITUNES_CHANGED_FILES<<EOF'
            git diff --name-only --diff-filter=ACMR "origin/${BASE}...HEAD" -- 'src/puzzles/*.ts' ':(exclude)src/puzzles/template.ts'
            echo EOF
          } >> "$GITHUB_ENV"
      - name: Changed puzzle iTunes check
        if: github.event_name == 'pull_request'
        run: npm run test:itunes
      - name: Full-fleet iTunes sweep
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:itunes:all
